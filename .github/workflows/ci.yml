name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ALSA headers for python-rtmidi
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install package
        run: pip install -e .
      - name: Unit tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -t .

  ui:
    name: UI logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ws (release harness test only)
        run: npm install --no-save ws@8.18.0
      - name: UI logic tests
        run: |
          for f in tests/weblogic/*.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
